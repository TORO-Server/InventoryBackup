name: InventoryBackup
version: '${version}'
main: marumasa.inventory_backup.Minecraft
api-version: '1.19'

commands:
  restore:
    description: インベントリを復元するコマンド
    usage: /restore <番号> | /restore player <プレイヤー名>
    permission-message: インベントリを復元する権限がありません。
    permission: inventory_backup.restore

permissions:
  inventory_backup.restore:
    description: 自分のインベントリの復元を許可する権限
    default: op
  inventory_backup.restore.others:
    description: 他のプレイヤーのインベントリの復元と、死亡時のインベントリの復元を許可する権限
    default: op
    children:
      inventory_backup.restore: true
